name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Cancel runs that were superseded by a newer push to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['lts', '1']
        os: [ubuntu-latest]
        include:
          # one run on the other operating systems with the latest Julia
          - version: '1'
            os: windows-latest
          - version: '1'
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      # Coverage is computed and uploaded once, from the Ubuntu / latest-Julia run.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The adapter of VRPSolver models (heuristicModelFromVRPSolver) lives in a package extension that needs VrpSolver.jl,
  # which is not registered: its tests run in their own environment (test/vrpsolver), and the coverage joins the one of
  # the job above (Codecov merges the reports of a commit).
  adapter:
    name: Adapter tests (VrpSolver.jl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install the environment of the adapter tests
        run: julia --project=test/vrpsolver -e 'using Pkg; Pkg.instantiate()'
      - name: Run the adapter tests
        run: julia --project=test/vrpsolver --code-coverage=user test/vrpsolver/runtests.jl
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: adapter
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
